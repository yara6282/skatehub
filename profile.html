<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkateHub | Pro Profile</title>
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- الناف بار الموحد -->
    <nav class="navbar">
        <!-- ... نفس كود الناف بار المعتاد ... -->
         <div class="navbar login-nav">
  <div class="logo">
    <a href="home.html" class="logo-link">
      <img src="./image/9037278.png" alt="SkateHub Logo">
      <span class="site-title">SkateHub</span>
    </a>
  </div>

  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="events.html">Events</a>
    <a href="community.html">Community</a>
    <a href="shop.html">Shop</a>
    <a href="tutorials.html">Tutorials</a>
  </div>

  <div class="nav-icons">
    <a href="login.html"><i class="fas fa-user"></i></a>
    <a href="signup.html"><i class="fas fa-user-plus"></i></a>
    <a href="notifications.html"><i class="fas fa-bell"></i></a>
  </div>
</div>
    </nav>

    <main class="profile-page">
        <!-- قسم الهيدر مع التداخل الاحترافي -->
        <section class="profile-hero">
            <div class="profile-banner">
                <img src="./image/pexels-introspectivedsgn-13583313.jpg" alt="Banner">
                <div class="banner-blend-overlay"></div> <!-- طبقة الدمج -->
            </div>
            
            <div class="user-profile-info">
                <div class="avatar-container">
                    <img src="./image/user-avatar.jpg" alt="Skater">
                    <div class="avatar-glow"></div>
                </div>
                <div class="user-text">
                    <h1 class="glitch-name">SKATER_<span>NAME</span></h1>
                    <p class="user-tag">SKATER@SKATEHUB.COM</p>
                </div>
            </div>
        </section>

        <!-- لوحة التحكم (مربعات ضخمة بجانب بعض) -->
        <section class="dashboard-grid">
            
            <!-- المربع الأول: قائمة الأمنيات (بحجم أكبر) -->
            <div class="db-card wishlist-card">
                <h3><i class="fas fa-heart"></i> SKATE_WISHLIST</h3>
                <div class="wishlist-container-large">
                    <div class="wish-item-lg">
                        <img src="./image/decks.png" alt="Gear">
                        <div class="wish-details">
                            <span>Baker Skull Pro Deck</span>
                            <p>$59.99</p>
                        </div>
                        <a href="shop.html" class="shop-link-lg"><i class="fas fa-cart-plus"></i></a>
                    </div>
                    <div class="wish-item-lg">
                        <img src="./image/shoes.png" alt="Gear">
                        <div class="wish-details">
                            <span>Vans Old Skool Black</span>
                            <p>$75.00</p>
                        </div>
                        <a href="shop.html" class="shop-link-lg"><i class="fas fa-cart-plus"></i></a>
                    </div>
                </div>
            </div>

            <!-- المربع الثاني: إدارة الحساب (بحجم أكبر) -->
            <div class="db-card account-actions">
                <h3><i class="fas fa-user-shield"></i> ACCOUNT_SYSTEM</h3>
                <div class="action-list-lg">
                    <a href="edit-profile.html" class="action-btn-lg">
                        <div class="btn-info">
                            <i class="fas fa-user-edit"></i>
                            <span>EDIT_PROFILE_INFO</span>
                        </div>
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <a href="orders.html" class="action-btn-lg">
                        <div class="btn-info">
                            <i class="fas fa-history"></i>
                            <span>ORDER_HISTORY</span>
                        </div>
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <a href="login.html" class="action-btn-lg logout-btn-lg">
                        <div class="btn-info">
                            <i class="fas fa-power-off"></i>
                            <span>LOGOUT</span>
                        </div>
                    </a>
                </div>
            </div>

        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="./java/cursor.js"></script>
</body>
</html>
