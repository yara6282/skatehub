    <main class="edit-container">
        <div class="edit-box">
            <div class="header">
                <h1 class="glitch-text">EDIT_<span>PROFILE</span></h1>
                <p>Update your skater credentials</p>
            </div>

            <form action="update_profile.php" method="POST" enctype="multipart/form-data">
                
                <!-- تعديل الصورة -->
                <div class="avatar-edit">
                    <div class="current-avatar">
                        <img src="./image/user-avatar.jpg" id="profile-preview" alt="Avatar">
                        <div class="overlay-upload">
                            <label for="avatar-input">
                                <i class="fas fa-camera"></i>
                            </label>
                            <input type="file" id="avatar-input" name="profile_img" accept="image/*" hidden>
                        </div>
                    </div>
                    <p>Change Profile Photo</p>
                </div>
<!-- ... (نفس الجزء العلوي والناف بار وصورة البروفايل) ... -->

<div class="form-grid">
    <!-- تعديل الاسم -->
    <div class="input-group">
        <label>FULL_NAME</label>
        <div class="input-field">
            <i class="fas fa-user"></i>
            <input type="text" name="full_name" value="Your Current Name" required>
        </div>
    </div>

    <!-- الإيميل (للقراءة فقط) -->
    <div class="input-group readonly">
        <label>EMAIL_ADDRESS (LOCKED)</label>
        <div class="input-field">
            <i class="fas fa-envelope"></i>
            <input type="email" value="skater@example.com" readonly>
        </div>
    </div>

    
    <!-- كلمة المرور الجديدة -->
    <div class="input-group">
        <label>NEW_PASSWORD</label>
        <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="new-pass" name="new_pass" placeholder="Leave blank to keep current">
        </div>
    </div>

    <!-- كلمة المرور الحالية (ستصبح مطلوبة فقط عند الحاجة) -->
    <div class="input-group" id="old-pass-group">
        <label id="old-pass-label">CURRENT_PASSWORD (OPTIONAL)</label>
        <div class="input-field">
            <i class="fas fa-key"></i>
            <input type="password" id="old-pass" name="old_pass" placeholder="Only needed to change password">
        </div>
    </div>
</div>
<!-- ... (الأزرار والسكريبتات) ... -->
                <div class="action-btns">
                    <button type="submit" class="save-btn">UPDATE_SYSTEM</button>
                    <a href="profile.html" class="cancel-btn">CANCEL</a>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="./java/cursor.js"></script>
    <script>
        // كود بسيط لعرض الصورة المختارة فوراً قبل الرفع
        document.getElementById('avatar-input').onchange = function (evt) {
            const [file] = this.files;
            if (file) {
                document.getElementById('profile-preview').src = URL.createObjectURL(file);
            }
        }
        const newPassInput = document.getElementById('new-pass');
const oldPassInput = document.getElementById('old-pass');
const oldPassGroup = document.getElementById('old-pass-group');
const oldPassLabel = document.getElementById('old-pass-label');

newPassInput.addEventListener('input', function() {
    if (this.value.length > 0) {
        // إذا بدأ المستخدم يكتب باسورد جديد
        oldPassInput.required = true;
        oldPassGroup.classList.add('needs-verify');
        oldPassLabel.innerText = "CURRENT_PASSWORD (REQUIRED NOW!)";
    } else {
        // إذا مسح الكلام وترك الحقل فارغاً
        oldPassInput.required = false;
        oldPassGroup.classList.remove('needs-verify');
        oldPassLabel.innerText = "CURRENT_PASSWORD (OPTIONAL)";
    }
});
    </script>
